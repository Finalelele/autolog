name: Wispbyte Keep Alive

on:
  schedule:
    # Запуск каждые 3 дня в 00:00 UTC (настрой под себя)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Позволяет запустить вручную для теста

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run script
        env:
          # Передаем секрет из настроек GitHub в переменную окружения
          WISP_COOKIE: ${{ secrets.WISP_COOKIE }}
        run: python keep_alive.py
